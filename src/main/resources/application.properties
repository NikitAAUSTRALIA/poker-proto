spring.application.name=poker-proto
spring.config.import=optional:file:.env[.properties]
telegram.bot.webhook-path=/webhook/telegram
telegram.bot.username=SovaPokerBot
telegram.bot.webapp-url=${TELEGRAM_BOT_WEBAPP_URL:${TELEGRAM_BOT_WEBHOOK_URL:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/poker}
spring.datasource.username=${DB_USER:poker}
spring.datasource.password=${DB_PASSWORD:poker}
spring.datasource.driver-class-name=org.postgresql.Driver
app.admin-tg-ids=${ADMIN_TG_IDS}